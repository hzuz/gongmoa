<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        function menu() {
            var x = document.getElementById('navbar');
            x.classList.toggle('show-menu');
        }
        const SUPABASE_URL = "https://zpluamwdkdcjtamnqyxz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwbHVhbXdka2RjanRhbW5xeXh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODkxOTcsImV4cCI6MjEwMTg2NTE5N30.-bm5cxlnIbKTK4eY6IAu9EL92ww-RQany_f5I_kU3o0";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.addEventListener(
            "DOMContentLoaded", async () => {
                const username = localStorage.getItem('loggedInUsername');

                if (!username) {
                    alert('로그인이 필요합니다.')
                    location.href = "/mypage";
                    return;
                }

                const {data,error} = await supabaseClient.from('users').select('*').eq('username',username).single();

                if(error) {
                    console.error("내 정보 불러오기 실패");
                    alert("정보 불러오기 실패");
                    return;
                }

                document.getElementById('info-username').innerText = data.username;
                document.getElementById('info-name').innerText = data.name;
                document.getElementById('info-birth').innerText = data.birth_date;
                document.getElementById('info-school').innerText = data.school_name;
                document.getElementById('info-major').innerText = data.major;
                document.getElementById('info-detail').innerText = data.detail_info;
            }
        )

        async function handleLogout() {
            localStorage.removeItem('loggedInUsername');
            location.href = "/mypage";
        }
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: white;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            box-sizing: border-box;
        }

        @media (max-width: 300px) {
            .menu {
                visibility: hidden;
            }
        }

        .block {
            display: inline-block;
        }

        .blank {
            height: 100px;
        }

        header {
            position: fixed;
            width: 100%;
            box-shadow: 3px 3px 10px rgba(150, 150, 150, 0.51);
            left: 0;
            top: 0;
            z-index: 10;
        }

        .head {
            display: flex;
            justify-content: space-between;
            height: 70px;
            line-height: 30px;
            background-color: white;
        }

        .logo {
            margin: 20px 0 0 5%;
            height: 30px;
            width: 100px;
            text-align: center;
            font-size: 20px;
        }

        .ham {
            cursor: pointer;
            margin: 20px 30px 0 0;
            height: 30px;
            width: 30px;
            background-color: rgb(140, 140, 140);
        }

        .menu {
            display: flex;
            justify-content: space-around;
            background-color: white;
            height: 30px;
            line-height: 20px;
        }

        .menu-item {
            display: block;
            width: 100px;
            text-align: center;
            color: black;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .navbar {
            display: none;
            position: fixed;
            right: 20px;
            top: 60px;
        }

        .navbar.show-menu {
            display: inherit;
            position: fixed;
            right: 20px;
            top: 60px;
        }

        .nav-item {
            display: block;
            width: 100px;
            height: 30px;
            text-align: center;
            color: black;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            line-height: 30px;
            background-color: white;
            border-style: solid;
            border-width: 30px;
            border-color: rgb(173, 173, 173);
        }

        .register-back {
            display: block;
            margin: 40px auto;
            padding: 10px;
            width: 300px;
            height: 410px;
            background-color: rgb(203, 250, 255);
            box-shadow: 0px 3px 9px rgba(150, 150, 150, 0.51);
        }
        .register {
            display: flex;
            justify-content: center;
            font-size: 20px;
            margin: 0 0 15px 0;
        }
        .type-box {
            width: 280px;
            height: 300px;
            background-color: rgb(255, 255, 255);
            margin: 0 auto;
            padding: 5px 5px 5px 5px;
        }

        .text-box {

        }

        .info {

        }

        .ex {

        textarea {

        }

        .school-box {
            display: flex;
            justify-content: center;
            margin: 0 0 -2px 0;
        }

        .email-box {

        }

        .major-box {
            display: flex;
            justify-content: center;
            margin: 0 0 15px 0;
        }

        .button-box {
            display: flex;
            justify-content: center;
        }

        input[type=text]{
            border-radius: 0;
            border-width: 0px;
            padding: 5px;
            width: 180px;
            background-color: rgb(240, 240, 240);
        }

        input[type=password] {
            border-radius: 0;

            padding: 5px;
            background-color: rgb(240, 240, 240);
        }

        .edit-go-button{
            border-radius: 0;
            border-width: 0px;
            width: 85px;
            height: 40px;
            background-color: rgb(189, 219, 253);
            font-size: 20px;

            text-decoration: none;
            color: black;
            cursor: pointer;
        }

        .log-out-button {
            border-radius: 0;
            border-width: 0px;
            width: 85px;
            height: 30px;
            background-color: rgb(215, 224, 235);
            font-size: 15px;
            line-height: 30px;
            text-align: center;
            text-decoration: none;
            color: black;
            cursor: pointer;
        }

        .edit-go {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }



        .log-out {
            display: flex;
            justify-content: center;
            margin-top: 10px;
        }

        select {
            border-width: 0px;
            background-color: rgb(240, 240, 240);
            height: 25px;
        }

        .button-blank {
            width: 5px;
        }

        .date-box {
            display: flex;
            justify-content: center;
            font-size: 15px;
            line-height: 25px;
            margin: 0 0 15px 0;
        }

        .date-blank {
            width: 4.5px;
        }

        .school-button {
            position: relative;
            top: -19.5px;
            left: 160px;
            background-color: rgb(128, 175, 255);
            width: 35px;
            height: 18px;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            color: white;
        }

        .email-verify {
            position: relative;
            top: -20px;
            left: 160px;
            background-color: rgb(128, 175, 255);
            width: 35px;
            height: 18px;
            font-size: 12px;
            line-height: 18px;
            text-align: center;
            color: white;
        }

        .applicant {
            display: flex;
            justify-content: center;
            max-width: 330px;
            background-color: whitesmoke;
            color: dimgray;
            font-size: 15px;
            font-weight: bold;
            padding: 10px;
            border-radius: 10px;
            margin: 30px auto;
            box-shadow: 0px 3px 9px rgba(150, 150, 150, 0.51);
        }

        .applicant-box {
            max-width: 500px;

            max-height: 410px;

        p, details, summary {

        .applicant-detail {
            margin-bottom: 20px;

        }

        .post-title {
            background-color: rgb(189, 219, 253);

            font-weight: bold;
            padding: 0 5px 5px 5px;
        }

        .post-text {
            font-size: 17px;
            margin: 5px;
        }
    </style>
</head>

<body>
<div class="container">
    <header>
        <div class="head">
            <div class="logo block">
                Gongmoa
            </div>
            <div class="ham block" onclick="menu()">
            </div>
        </div>
        <div class="menu">
            <a href="/list" class="menu-item">글 목록</a>
            <a href="/post" class="menu-item">글쓰기</a>
            <a href="/mypage" class="menu-item">마이페이지</a>
        </div>
        <div class="navbar" id="navbar">
            <a href="/list" class="nav-item">글 목록</a>
            <a href="/post" class="nav-item">글쓰기</a>
            <a href="/mypage" class="nav-item">마이페이지</a>
        </div>
    </header>
    <div class="blank"></div>
    <div class="register-back">
        <div class="register block">
            마이페이지
        </div>
        <div class="type-box">
            <div class="text-box">
                <div class="info">
                    아이디: <span id="info-username"></span> <br>

                    이름: <span id="info-name"></span> <br>

                    생년월일: <span id="info-birth"></span> <br>

                    학교: <span id="info-school"></span> <br>

                    학과: <span id="info-major"></span> <br>

                    내 정보: <span id="info-detail"></span> <br>
                </div>

            </div>

        </div>

        <div class="edit-go">
            <a href="/mypage-edit.html" class="edit-go-button">수정</a>
        </div>
    </div>
    <div class="applicant">신청자 목록</div>
    <div class="applicant-box">
        <div class="applicant-detail" th:each="applicationDTO : ${applicationList}">
            <div class="post-title" th:text="${applicationDTO.boardTitle}"></div>
            <div class="post-text">
                <p th:text="|이름: ${applicationDTO.applicantName}|"></p>
                <p th:text="|학교: ${applicationDTO.univName}|"></p>
                <p th:text="|학과: ${applicationDTO.department}|"></p>
                <p th:text="|학교이메일: ${applicationDTO.univEmail}|"></p>
                <details>
                    <summary>스펙 보기</summary>
                    <p th:text="${applicationDTO.info}"></p>
                </details>
            </div>
        </div>
    </div>
    <div class="log-out">
        <button type="button" class="log-out-button" onclick="handleLogout()">로그아웃</button>
    </div>
    <div class="blank"></div>
</div>
</body>
</html>
