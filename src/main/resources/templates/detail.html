<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: white;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            box-sizing: border-box;
        }

        @media (max-width: 300px) {
            .menu {
                visibility: hidden;
            }
        }

        .block {
            display: inline-block;
        }

        .blank {
            height: 100px;
        }

        header {
            position: fixed;
            width: 100%;
            box-shadow: 3px 3px 10px rgba(150, 150, 150, 0.51);
            left: 0;
            top: 0;
            z-index: 10;
        }

        .head {
            display: flex;
            justify-content: space-between;
            height: 70px;
            line-height: 30px;
            background-color: white;
        }

        .logo {
            margin: 20px 0 0 5%;
            height: 30px;
            width: 100px;
            text-align: center;
            font-size: 20px;
        }

        .ham {
            cursor: pointer;
            margin: 20px 30px 0 0;
            height: 30px;
            width: 30px;
            background-color: rgb(140, 140, 140);
        }

        .menu {
            display: flex;
            justify-content: space-around;
            background-color: white;
            height: 30px;
            line-height: 20px;
        }

        .menu-item {
            display: block;
            width: 100px;
            text-align: center;
            color: black;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
        }

        .navbar {
            display: none;
            position: fixed;
            right: 20px;
            top: 60px;
        }

        .navbar.show-menu {
            display: inherit;
            position: fixed;
            right: 20px;
            top: 60px;
        }

        .nav-item {
            display: block;
            width: 100px;
            height: 30px;
            text-align: center;
            color: black;
            text-decoration: none;
            font-size: 16px;
            font-weight: bold;
            line-height: 30px;
            background-color: white;
            border-style: solid;
            border-width: 30px;
            border-color: rgb(173, 173, 173);
        }

        .post-box {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
            max-height: 530px;
            overflow-y: auto;
        }

        .title {
            padding: 5px 10px;
            background-color: pink;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            word-break: break-all;
            align-items: center;
            margin: 0 20px;
        }

        .title button {
            background-color: red;
            color: white;
            font-size: 15px;
            padding: 5px;
            flex-shrink: 0;
            border:none;
            cursor:pointer;
        }

        .post {
            border: 8px solid mistyrose;
            background-color: white;
            margin: 0  20px 20px 20px;
            display: flex;
            min-height: 650px;
            flex-wrap: wrap;
            padding: 7px;
            justify-content: space-between;
        }

        .image {
            width: 100%;
            max-width: 500px;
            max-height: 650px;
            min-height: 400px;
            background-color: gray;
            gap: 10px;
        }

        .post-right {
            display: flex;
            flex-direction: column;
            flex-wrap: wrap;
            width: 100%;
            max-width: 570px;
        }
        .image img{
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
        }

        .lable {
            width: 100px;
            height: 50px;
            background-color: white;
            color: red;
            font-size: 32px;
            font-weight: bold;
            align-self: flex-end;
            padding: 5px;
        }

        .text {
            margin-top: 10px;
            width: 100%;
            max-width: 570px;
            word-break: break-all;
            padding: 7px;
            box-sizing: border-box;
        }

        .info {
            border: 8px solid lightgrey;
            background-color: white;
            margin: 10px 20px;
            min-height: 200px;
            padding: 5px;
            box-sizing: border-box;
            word-break: break-all;
        }
        .apply-box{
            text-align:center;
        }
        .applyBtn {
            margin: 10px 20px;
            background-color: red;
            color: white;
            font-size: 40px;
            font-weight: bold;
            border:none;
            cursor:pointer;
            border-radius:5px;
        }
        .cancelBtn{
            margin: 10px 20px;
            color: white;
            font-size: 40px;
            font-weight: bold;
            border:none;
            cursor:pointer;
            border-radius:5px;
            background-color:green;
        }
        .modal{
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            display:none;
            justify-content:center;
            align-items:center;
            background-color:rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: white;
            border:5px solid indianred;
            padding:10px;
            text-align:center;
        }
        .btn-box button{
            margin:7px;
            cursor:pointer;
            background-color:mistyrose;
            border:2px solid indianred;
            border-radius:5px;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        function menu() {
            var x = document.getElementById('navbar');
            x.classList.toggle('show-menu');
        }
        const SUPABASE_URL = "https://zpluamwdkdcjtamnqyxz.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpwbHVhbXdka2RjanRhbW5xeXh6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYyODkxOTcsImV4cCI6MjEwMTg2NTE5N30.-bm5cxlnIbKTK4eY6IAu9EL92ww-RQany_f5I_kU3o0";
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        async function apply() {

            const username = localStorage.getItem('loggedInUsername');

            const { data, error } = await supabaseClient.from('users')
                .select('username, name, school_name, major, email, detail_info').eq('username', username).single();

            if (error) {
                console.log(error);
                return;
            }

            document.getElementById('memberId').value = data.username;
            document.getElementById('applicantName').value = data.name;
            document.getElementById('univName').value = data.school_name;
            document.getElementById('department').value = data.major;
            document.getElementById('univEmail').value = data.email;
            document.getElementById('info').value = data.detail_info;

            document.getElementById('applyForm').submit();
        }
    </script>
</head>
<body>
<div class="container">
    <header>
        <div class="head">
            <div class="logo block">
                Gongmoa
            </div>
            <div class="ham block" onclick="menu()">
            </div>
        </div>
        <div class="menu">
            <a href="/list" class="menu-item">글 목록</a>
            <a href="/post" class="menu-item">글쓰기</a>
            <a href="/mypage" class="menu-item">마이페이지</a>
        </div>
        <div class="navbar" id="navbar">
            <a href="/list" class="nav-item">글 목록</a>
            <a href="/post" class="nav-item">글쓰기</a>
            <a href="/mypage" class="nav-item">마이페이지</a>
        </div>
    </header>
    <div class="blank"></div>
    <div class="post-box">
        <div class="title">
            <span th:text="${board.boardTitle}"></span>
            <button onclick="openModal()">수정하기</button>
        </div>
        <div class="modal" id="modal">
            <div class="modal-content">
                비밀번호 확인 :
                <input type="password" id="pwdInput" />
                <div class="btn-box">
                    <button onclick="closeModal()">취소</button>
                    <button onclick="verifyPassword()">확인</button>
                </div>
            </div>
        </div>
        <script th:inline="javascript">
            const modal=document.getElementById("modal");
            const pwdInput=document.getElementById("pwdInput");
            const correctPwd=/*[[${board.boardPass}]]*/"";
            function openModal(){
                modal.style.display="flex";
                pwdInput.value="";
                pwdInput.focus();}
            function closeModal(){
                modal.style.display="none";}
            function verifyPassword(){
                if(pwdInput.value===correctPwd){
                    closeModal();
                    location.href = `/edit/[[${board.id}]]`;}
                else{
                    alert("비밀번호가 틀렸습니다");
                    pwdInput.value="";
                    pwdInput.focus();}
            }
        </script>
        <div class="post">
            <div class="image" th:if="${board.fileAttached==1}">
                    <img th:src="@{|/upload/${boardFile.storedFileName}|}"  alt="">
            </div>
            <div class="image" th:if="${board.fileAttached==0}"></div>
            <div class="post-right">
                <div class="lable" th:text="${board.dday>0?'D-'+board.dday:board.dday==0?'D-Day':'마감'}"></div>
                <p class="text" th:text="${board.boardContents}"></p>
            </div>
        </div>
        <div class="info">
            <p>[작성자 정보]</p>
            <p th:text="|학교:  ${board.univName}|"></p>
            <p th:text="|학과:  ${board.department}|"></p>
            <p th:text="|스펙:  ${board.info}|"></p>
        </div>
        <form id="applyForm" method="post" th:action="@{/apply/{boardId}(boardId=${board.id})}">
            <input type="hidden" id="memberId" name="memberId">
            <input type="hidden" id="applicantName" name="applicantName">
            <input type="hidden" id="univName" name="univName">
            <input type="hidden" id="department" name="department">
            <input type="hidden" id="univEmail" name="univEmail">
            <input type="hidden" id="info" name="info">
            <div class="apply-box">
                <button type="submit" class="cancelBtn" th:if="${isApplied and board.dday>0}"
                        th:formaction="@{/cancel/{id}(id=${applicationDTO.id})}">신청취소</button>
                <button type="button" class="applyBtn" th:if="${!isApplied and board.dday>0}"
                        onclick="apply()">신청하기</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
